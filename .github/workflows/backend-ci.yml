name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: labor_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U foundation_test -d labor_foundation_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/labor_foundation_test
      TEST_DATABASE_USERNAME: foundation_test
      TEST_DATABASE_PASSWORD: ci-test-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Style, unit tests, package and PostgreSQL integration tests
        run: mvn -B -ntp -Pintegration clean verify
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/checkstyle-result.xml
          retention-days: 14
      - name: Upload executable application
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/labor-backend-*.jar
          retention-days: 7
