services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: labor_db
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor -d labor_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
