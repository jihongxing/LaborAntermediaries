spring:
  application:
    name: labor-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labor_db}
    username: ${DB_USERNAME:labor}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
foundation:
  security:
    public-key: ${JWT_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:labor-identity}
    audience: ${JWT_AUDIENCE:labor-backend}
  crypto:
    active-key: ${CRYPTO_ACTIVE_KEY:}
  storage:
    root: ${STORAGE_ROOT:./var/private-files}
  tasks:
    enabled: ${TASKS_ENABLED:false}
logging:
  level:
    root: INFO
    com.company.labor: INFO
