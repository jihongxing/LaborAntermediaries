spring:
  application:
    name: labor-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labor_db}
    username: ${DB_USERNAME:labor}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
foundation:
  # 业务表必须声明组织隔离；组织以自身 id 作为租户，跨组织读取只能走投递快照。
  tenant-tables:
    - business_organization
    - business_organization_revision
    - business_membership
    - business_membership_request
    - business_demand
    - business_demand_revision
    - business_review_decision
    - business_demand_delivery
    - business_bid
    - business_bid_revision
    - business_bid_award
    - business_bp05_snapshot
    - business_bid_supervision_event
  # 认证账号跨组织共享，不能添加租户列或接受组织过滤。
  shared-tables:
    - auth_account
    - auth_login_identity
    - auth_credential
    - auth_verification_challenge
    - auth_password_reset_ticket
    - auth_refresh_session
    - auth_security_event
    - auth_consent_record
    - auth_identity_binding_ticket
  security:
    public-key: ${JWT_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:labor-identity}
    audience: ${JWT_AUDIENCE:labor-backend}
  authentication:
    enabled: ${AUTH_ENABLED:false}
    private-key: ${AUTH_PRIVATE_KEY:}
    public-key: ${AUTH_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:labor-auth}
    audience: ${AUTH_JWT_AUDIENCE:labor-backend}
    phone-hmac-key: ${AUTH_PHONE_HMAC_KEY:}
    mock-sms-enabled: ${AUTH_MOCK_SMS_ENABLED:false}
    challenge-retention: ${AUTH_CHALLENGE_RETENTION:24h}
    session-retention: ${AUTH_SESSION_RETENTION:90d}
    security-event-retention: ${AUTH_SECURITY_EVENT_RETENTION:730d}
    retention-cleanup-interval-ms: ${AUTH_RETENTION_CLEANUP_INTERVAL_MS:86400000}
  crypto:
    active-key: ${CRYPTO_ACTIVE_KEY:}
  storage:
    root: ${STORAGE_ROOT:./var/private-files}
  tasks:
    enabled: ${TASKS_ENABLED:false}
logging:
  level:
    root: INFO
    com.company.labor: INFO
